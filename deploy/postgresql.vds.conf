# PostgreSQL tuning for 2 GB RAM VDS (Docker Compose)
# При config_file= этот файл — основной конфиг; без listen_addresses PG слушает только localhost.

listen_addresses = '*'
port = 5432

shared_buffers = 128MB
effective_cache_size = 512MB
maintenance_work_mem = 64MB
work_mem = 4MB
max_connections = 20
wal_buffers = 4MB
checkpoint_completion_target = 0.9
random_page_cost = 1.1
