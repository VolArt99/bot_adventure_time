services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adventure_time}
      POSTGRES_USER: ${POSTGRES_USER:-bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bot} -d ${POSTGRES_DB:-adventure_time}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # PostgreSQL доступен только внутри docker-сети
    expose:
      - "5432"

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-adventure_time}
      ENV: ${ENV:-production}
      AUTO_INIT_DB: ${AUTO_INIT_DB:-1}
    depends_on:
      postgres:
        condition: service_healthy
    # Бот работает в polling-режиме и не требует входящих HTTP-портов
    # ports: []

volumes:
  postgres_data:
