services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adventure_time}
      POSTGRES_USER: ${POSTGRES_USER:-bot}
      # POSTGRES_PASSWORD — только из .env (env_file), чтобы $ в пароле не ломал compose
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgresql.vds.conf:/etc/postgresql/postgresql.conf:ro
      - ./deploy/pg_hba.docker.conf:/etc/postgresql/pg_hba.conf:ro
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - listen_addresses=*
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bot} -d ${POSTGRES_DB:-adventure_time}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # PostgreSQL доступен только внутри docker-сети
    expose:
      - "5432"

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Пустая строка перекрывает DATABASE_URL из .env — иначе битый URL ломает подключение
      DATABASE_URL: ""
      PGHOST: postgres
      PGPORT: 5432
      ENV: ${ENV:-production}
      AUTO_INIT_DB: ${AUTO_INIT_DB:-1}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-m", "bot.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    # Бот работает в polling-режиме и не требует входящих HTTP-портов
    # ports: []

volumes:
  postgres_data:

networks:
  default:
    name: bot_adventure_time_net
